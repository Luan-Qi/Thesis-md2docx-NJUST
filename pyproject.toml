[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-md2docx-njust"
version = "0.1.0"
description = "Markdown to DOCX/PDF exporter for Nanjing University of Science and Technology master's theses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "thesis-md2docx contributors" }
]
dependencies = [
  "Pillow>=9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=6"
]

keywords = ["markdown", "docx", "pdf", "thesis", "ooxml", "nanjing-university-of-science-and-technology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/haodongcui/Thesis-md2docx"

[project.scripts]
md2docx = "thesis_md2docx.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["thesis_md2docx*"]

[tool.setuptools.package-data]
thesis_md2docx = [
  "math/latex2omml_node/*.js",
  "math/latex2omml_node/package.json",
  "math/latex2omml_node/package-lock.json",
  "pdf/backends/word/*.vbs",
  "pdf/backends/libreoffice/*.xba",
  "profiles/njust_master_thesis/assets/*.png",
  "profiles/njust_master_thesis/format_requirements/*.md",
]
